name: Analyse de sécurité

# Les catégories suivent celles d'une chaîne d'analyse classique : code (SAST),
# secrets, dépendances, image, infrastructure, puis l'application en marche
# (DAST). Chaque analyseur qui sait écrire du SARIF le dépose dans l'onglet
# Security du dépôt, qui joue le rôle de tableau de bord : une vulnérabilité y
# a un état, une sévérité et une histoire.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une analyse hebdomadaire : les vulnérabilités connues apparaissent après
    # coup, sans que le code ait bougé.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Deux poussées rapprochées lançaient deux chaînes complètes, dont la première
# n'intéressait plus personne. Sur une demande de fusion, la précédente est donc
# annulée. Sur « main », jamais : chaque commit garde son verdict, et c'est ce
# verdict qui autorise à poser un tag dessus.
concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le minimum au niveau de la chaîne ; chaque travail élargit s'il doit déposer
# ses résultats dans l'onglet Security.
permissions:
  contents: read

jobs:
  # ---- SAST : le code lui-même ---------------------------------------------
  codeql:
    name: SAST — CodeQL (${{ matrix.langue }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        langue: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.langue }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /langue:${{ matrix.langue }}

  bandit:
    name: SAST — Bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit[sarif]
      - name: Analyse
        run: bandit -r app -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Échouer si un défaut subsiste
        run: bandit -r app -q

  # ---- secrets : rien de sensible ne doit entrer dans l'historique ----------
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks lit tout l'historique, pas la copie
      - name: Gitleaks
        run: |
          version=8.21.2
          curl -sSL --retry 5 --retry-delay 5             "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Aucun « needs » entre les travaux : le CDN des actions répond parfois
  # « 429 Too Many Requests », et enchaîner les travaux transformait un
  # téléchargement raté en trois travaux non exécutés. Indépendants, ils
  # échouent seuls et se relancent seuls.

  # ---- dépendances, image et infrastructure --------------------------------
  image:
    name: Image et infrastructure — Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t atrium:analyse .

      # Trivy est installé depuis sa version publiée plutôt que par une action :
      # une archive de moins à demander au CDN des actions, qui a déjà répondu
      # « 429 Too Many Requests » deux fois, et un téléchargement qui réessaie.
      # Changer d'image de base ne se voit pas dans une analyse statique : elle
      # dirait « aucune vulnérabilité » d'un conteneur qui ne démarre plus. On
      # le lance donc, et on attend qu'il réponde de lui-même.
      - name: L'image démarre et répond
        run: |
          docker run -d --name atrium-essai -p 8420:8420 atrium:analyse
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8420/api/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8420/api/health > /dev/null
          docker exec atrium-essai python -c "import sys; print('python de l image :', sys.version)"
          docker rm -f atrium-essai

      # Abandonner les privilèges ne se vérifie pas en lisant le Dockerfile : on
      # lance l'image avec PUID/PGID et l'on demande au processus qui il est.
      - name: L'image descend sous le compte demandé
        run: |
          mkdir -p /tmp/atrium-nonroot
          docker run -d --name atrium-descendu -e PUID=99 -e PGID=100             -p 8421:8420 -v /tmp/atrium-nonroot:/config atrium:analyse
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8421/api/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8421/api/health > /dev/null
          uid=$(docker exec atrium-descendu awk '/^Uid:/ {print $2}' /proc/1/status)
          gid=$(docker exec atrium-descendu awk '/^Gid:/ {print $2}' /proc/1/status)
          echo "le serveur tourne sous $uid:$gid"
          test "$uid" = "99"
          test "$gid" = "100"
          # et il doit pouvoir écrire dans /config, sans quoi la descente
          # l'aurait rendu inutilisable
          docker exec atrium-descendu sh -c 'touch /config/.essai && rm /config/.essai'
          docker logs atrium-descendu | head -5
          docker rm -f atrium-descendu

      - name: Installer Trivy
        run: |
          version=0.74.0
          curl -sSL --retry 5 --retry-delay 5             "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz"             | tar -xz -C /tmp trivy
          /tmp/trivy --version

      # L'application n'a aucune dépendance Python : ce qui se met à jour, et
      # donc ce qui vieillit, c'est l'image de base.
      - name: Vulnérabilités de l'image
        run: |
          /tmp/trivy image --no-progress --format sarif --output trivy-image.sarif             --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed atrium:analyse

      - name: Dockerfile et compose
        run: |
          # « --no-progress » n'existe que pour « trivy image » : sur « config »,
          # il fait échouer la commande avec « unknown flag ». C'est « -q ».
          /tmp/trivy config -q --format sarif --output trivy-config.sarif .

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---- l'interface, dans un vrai DOM ---------------------------------------
  front:
    name: Interface (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # jsdom ne sert qu'à ces suites : il n'entre ni dans l'image, ni dans ce
      # que l'utilisateur installe. « --no-save » le dit.
      - name: Installer jsdom
        run: npm install --no-save jsdom@29
      # La page est montée telle quelle, nourrie de données, et l'on regarde ce
      # qu'elle en fait : filtres, rangement des tuiles, barre d'attente Docker,
      # carte onduleur, logos, sélection de texte, fenêtres.
      - name: Suites d'interface
        run: node outils/front/lancer.js

  # ---- DAST : l'application en marche --------------------------------------
  matrice:
    name: DAST — matrice des routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ce travail ne dépose rien dans l'onglet Security : il n'a donc pas besoin
    # d'y écrire.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Démarrer Atrium
        run: |
          mkdir -p /tmp/atrium
          ATRIUM_PORT=8420 ATRIUM_CONFIG_DIR=/tmp/atrium python app/server.py             > /tmp/atrium/serveur.log 2>&1 &
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8420/api/health && break
            sleep 1
          done
          # Sans ce contrôle, un serveur mort-né se voyait deux étapes plus loin,
          # sous le nom d'un test qui n'y était pour rien.
          curl -sf http://127.0.0.1:8420/api/health > /dev/null || {
            echo "le serveur n'a pas démarré :"; cat /tmp/atrium/serveur.log; exit 1; }

      # Chaque route du serveur est appelée sans session puis avec : seules les
      # routes publiques doivent répondre aux inconnus. La liste est relue dans
      # le source, une route ajoutée sans garde échoue donc le jour même.
      - name: Matrice de sécurité
        run: python outils/audit_securite.py http://127.0.0.1:8420

      - name: Compte de secours
        run: python outils/test_compte_secours.py

      # Deux fiches peuvent porter le même nom : c'est l'identifiant qui range
      # mesures, état, historique et alertes.
      - name: Applications homonymes
        run: python outils/test_homonymes.py

      # Une signature qui se contente d'une réponse quelconque fait passer un
      # service pour un autre, et réclame la clé d'une API inexistante.
      - name: "Détection : aucune signature complaisante"
        run: python outils/test_imposteurs.py

      # Une apostrophe droite dans une traduction casse tout le fichier, et
      # l'interface repart alors sur ses clés brutes. Le coût du contrôle est
      # d'une seconde.
      - name: Traductions lisibles par le navigateur
        run: node --check app/static/i18n.js

      # Le serveur et le module Home Assistant annoncent la même version, sans
      # quoi l'un des deux ment sur ce qu'il est.
      - name: Version cohérente
        run: python outils/verifier_version.py

      # Les logos viennent d'un catalogue extérieur, qui renomme parfois ses
      # dessins. Le contrôle s'abstient si le catalogue est injoignable.
      - name: Chaque nom trouve son logo
        run: python outils/verifier_icones.py

      # Les lecteurs d'intégration, face à des serveurs qui imitent les vraies
      # API — travers compris.
      - name: Lecteurs d'intégration
        run: python outils/test_lecteurs.py

      - name: Lecteurs des intégrations branchées en dernier
        run: python outils/test_lecteurs_muets.py

      # Un onduleur se lit en direct, par un protocole texte : le test monte un
      # faux upsd et vérifie ce qu'Atrium en tire, jusqu'au refus d'une adresse
      # publique.
      - name: Onduleur (NUT)
        run: python outils/test_nut.py

      # Prévenir sur bascule, et se taire le reste du temps.
      - name: Notifications
        run: python outils/test_notifications.py

      # Abandonner les privilèges est irréversible : la décision se vérifie à
      # part, avant d'être appliquée.
      - name: Point d'entrée du conteneur
        run: python outils/test_entree.py

      # Une barre d'attente qui avance toute seule ment sur ce qu'elle mesure :
      # le compteur ne doit décrire que du travail réellement fait.
      - name: Attente du relevé Docker
        run: python outils/test_avancement_docker.py
