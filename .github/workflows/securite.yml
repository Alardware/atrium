name: Analyse de sécurité

# Les catégories suivent celles d'une chaîne d'analyse classique : code (SAST),
# secrets, dépendances, image, infrastructure, puis l'application en marche
# (DAST). Chaque analyseur qui sait écrire du SARIF le dépose dans l'onglet
# Security du dépôt, qui joue le rôle de tableau de bord : une vulnérabilité y
# a un état, une sévérité et une histoire.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une analyse hebdomadaire : les vulnérabilités connues apparaissent après
    # coup, sans que le code ait bougé.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---- SAST : le code lui-même ---------------------------------------------
  codeql:
    name: SAST — CodeQL (${{ matrix.langue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langue: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.langue }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /langue:${{ matrix.langue }}

  bandit:
    name: SAST — Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit[sarif]
      - name: Analyse
        run: bandit -r app -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Échouer si un défaut subsiste
        run: bandit -r app -q

  # ---- secrets : rien de sensible ne doit entrer dans l'historique ----------
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks lit tout l'historique, pas la copie
      - name: Gitleaks
        run: |
          version=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---- dépendances, image et infrastructure --------------------------------
  image:
    name: Image et infrastructure — Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t atrium:analyse .

      # L'application n'a aucune dépendance Python : ce qui se met à jour, et
      # donc ce qui vieillit, c'est l'image de base.
      - name: Vulnérabilités de l'image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: atrium:analyse
          format: sarif
          output: trivy-image.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true

      - name: Dockerfile et compose
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---- DAST : l'application en marche --------------------------------------
  matrice:
    name: DAST — matrice des routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Démarrer Atrium
        run: |
          mkdir -p /tmp/atrium
          ATRIUM_PORT=8420 ATRIUM_CONFIG_DIR=/tmp/atrium python app/server.py &
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8420/api/health && break
            sleep 1
          done

      # Chaque route du serveur est appelée sans session puis avec : seules les
      # routes publiques doivent répondre aux inconnus. La liste est relue dans
      # le source, une route ajoutée sans garde échoue donc le jour même.
      - name: Matrice de sécurité
        run: python outils/audit_securite.py http://127.0.0.1:8420

      - name: Compte de secours
        run: python outils/test_compte_secours.py
