name: Publier l'image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Une publication ne s'annule pas en cours de route : deux poussées
# rapprochées se suivent au lieu de se marcher dessus.
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Trois architectures compilées par émulation : large, mais borné.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Une image étiquetée d'après le tag mais qui s'annonce autrement dans son
      # propre écran ne se rattrape pas : on vérifie avant de construire.
      - name: Version cohérente
        run: python3 outils/verifier_version.py

      - name: Configurer QEMU (compilation multi-architecture)
        uses: docker/setup-qemu-action@v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'image porte son commit : l'interface l'affiche, et l'on sait alors si
      # le conteneur qui tourne est celui du jour.
      - name: Empreinte de la construction
        id: empreinte
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATRIUM_BUILD=${{ steps.empreinte.outputs.sha }}
            ATRIUM_BUILD_DATE=${{ steps.empreinte.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
